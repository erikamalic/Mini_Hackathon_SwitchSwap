<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Freighter Testnet Connect</title>
<script src="https://cdn.jsdelivr.net/npm/@stellar/freighter-api@3.0.0"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #0f1117;
    color: #e6e9f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #171a23;
    border: 1px solid #262b3a;
    border-radius: 16px;
    padding: 32px;
    width: 420px;
    max-width: 92vw;
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .subtitle { color: #8b93a7; font-size: 13px; margin-bottom: 24px; }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  button:hover { opacity: .9; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: #4d6bfe; color: #fff; }
  .btn-secondary { background: #232838; color: #e6e9f0; margin-top: 10px; }
  .hidden { display: none; }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #232838;
    font-size: 14px;
  }
  .row:last-child { border-bottom: none; }
  .label { color: #8b93a7; }
  .value { font-family: monospace; font-size: 13px; }
  .value.ok { color: #3ddc97; }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.testnet { background: rgba(61,220,151,.15); color: #3ddc97; }
  .badge.wrong { background: rgba(255,107,107,.15); color: #ff6b6b; }
  #status { font-size: 13px; margin-top: 14px; min-height: 18px; }
  #status.error { color: #ff6b6b; }
  #status.info { color: #8b93a7; }
  .avatar {
    width: 56px; height: 56px; border-radius: 50%;
    background: linear-gradient(135deg, #4d6bfe, #9b5bff);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; margin-bottom: 14px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">F</div>
    <h1>Connect Freighter</h1>
    <p class="subtitle">Stellar Testnet</p>

    <button id="connectBtn" class="btn-primary">Connect Wallet</button>
    <button id="disconnectBtn" class="btn-secondary hidden">Disconnect</button>

    <div id="walletInfo" class="hidden" style="margin-top: 20px;">
      <div class="row">
        <span class="label">Address</span>
        <span class="value" id="address">—</span>
      </div>
      <div class="row">
        <span class="label">Network</span>
        <span class="value"><span id="networkBadge" class="badge testnet">TESTNET</span></span>
      </div>
      <div class="row">
        <span class="label">XLM Balance</span>
        <span class="value ok" id="balance">—</span>
      </div>
    </div>

    <p id="status" class="info"></p>
  </div>

<script>
  const connectBtn = document.getElementById("connectBtn");
  const disconnectBtn = document.getElementById("disconnectBtn");
  const walletInfo = document.getElementById("walletInfo");
  const addressEl = document.getElementById("address");
  const networkBadge = document.getElementById("networkBadge");
  const balanceEl = document.getElementById("balance");
  const statusEl = document.getElementById("status");

  function setStatus(msg, type = "info") {
    statusEl.textContent = msg;
    statusEl.className = type;
  }

  function shortAddr(addr) {
    return addr.slice(0, 6) + "..." + addr.slice(-4);
  }

  async function getBalance(publicKey) {
    const res = await fetch(`https://horizon-testnet.stellar.org/accounts/${publicKey}`);
    if (!res.ok) throw new Error("Account not found on testnet (need friendbot funding?)");
    const data = await res.json();
    const xlm = data.balances.find(b => b.asset_type === "native");
    return xlm ? parseFloat(xlm.balance).toFixed(2) + " XLM" : "0 XLM";
  }

  async function connect() {
    setStatus("");
    if (!window.freighterApi) {
      setStatus("Freighter extension not detected. Please install it and refresh.", "error");
      return;
    }
    try {
      connectBtn.disabled = true;
      connectBtn.textContent = "Connecting...";

      const publicKey = await window.freighterApi.getPublicKey();
      const network = await window.freighterApi.getNetwork();

      addressEl.textContent = shortAddr(publicKey);
      networkBadge.textContent = network.toUpperCase();
      networkBadge.className = "badge " + (network.toUpperCase() === "TESTNET" ? "testnet" : "wrong");

      balanceEl.textContent = "Loading...";
      try {
        balanceEl.textContent = await getBalance(publicKey);
      } catch (e) {
        balanceEl.textContent = "—";
        setStatus(e.message, "error");
      }

      walletInfo.classList.remove("hidden");
      connectBtn.classList.add("hidden");
      disconnectBtn.classList.remove("hidden");
      if (network.toUpperCase() !== "TESTNET") {
        setStatus("Warning: Freighter is not set to TESTNET.", "error");
      }
    } catch (err) {
      setStatus("Connection rejected or failed: " + err.message, "error");
    } finally {
      connectBtn.disabled = false;
      connectBtn.textContent = "Connect Wallet";
    }
  }

  function disconnect() {
    walletInfo.classList.add("hidden");
    connectBtn.classList.remove("hidden");
    disconnectBtn.classList.add("hidden");
    setStatus("");
  }

  connectBtn.addEventListener("click", connect);
  disconnectBtn.addEventListener("click", disconnect);

  if (!window.freighterApi) {
    setStatus("Freighter extension not detected — install it from freighter.app", "info");
  }
</script>
</body>
</html>
